name: LiveRestore
options:
  bundleIdPrefix: es.ivan
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  LiveRestore:
    type: application
    platform: iOS
    sources: [LiveRestore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.ivan.liverestore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiveRestore
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Guarda el HEIC y su MOV juntos como una Live Photo en Fotos.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
schemes:
  LiveRestore:
    build:
      targets:
        LiveRestore: all
